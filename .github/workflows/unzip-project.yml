name: Unzip project ZIP

on:
  push:
    branches:
      - main
    paths:
      - "bac-tn-plus.zip"

permissions:
  contents: write

jobs:
  unzip-and-replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unzip project
        run: |
          set -e

          test -f bac-tn-plus.zip

          rm -rf .project-extracted
          mkdir -p .project-extracted

          unzip -q -o bac-tn-plus.zip -d .project-extracted

          if [ "$(find .project-extracted -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1 ] && \
             [ "$(find .project-extracted -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 0 ]; then
            ROOT_DIR="$(find .project-extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            cp -a "$ROOT_DIR"/. .project-extracted/
            rm -rf "$ROOT_DIR"
          fi

          rm -rf .project-extracted/.git
          rm -rf .project-extracted/.github

      - name: Replace project files
        run: |
          set -e

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "bac-tn-plus.zip" \
            ! -name ".project-extracted" \
            -exec rm -rf {} +

          cp -a .project-extracted/. .

          rm -rf .project-extracted

      - name: Commit extracted project
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No project changes detected."
            exit 0
          fi

          git commit -m "chore: update project from ZIP"
          git push
